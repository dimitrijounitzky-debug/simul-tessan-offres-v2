<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessan — Simulateur Commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #0F0F0E;
  --ink2:      #52504A;
  --ink3:      #9E9B93;
  --paper:     #FAF9F6;
  --card:      #FFFFFF;
  --line:      #ECEAE3;
  --line2:     #D8D5CC;
  --blue:      #1A56DB;
  --blue-soft: #EEF3FF;
  --blue-mid:  #C7D7FB;
  --green:     #0D6E3D;
  --green-soft:#ECFDF5;
  --green-mid: #A7F3D0;
  --amber:     #92400E;
  --amber-soft:#FFFBEB;
  --amber-mid: #FDE68A;
  --red:       #9B1C1C;
  --red-soft:  #FEF2F2;
  --red-mid:   #FCA5A5;
  --r4: 4px; --r8: 8px; --r12: 12px; --r16: 16px; --r99: 999px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: 'Outfit', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ─── NAV ─────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 200;
  background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: stretch; padding: 0 1.5rem;
  height: 52px;
}
.nav-brand {
  font-family: 'Instrument Serif', serif; font-size: 18px;
  color: var(--ink); display: flex; align-items: center;
  padding-right: 2rem; letter-spacing: -.01em; white-space: nowrap;
  border-right: 1px solid var(--line); margin-right: 1rem;
}
.nav-brand span { color: var(--blue); }
.tabs { display: flex; align-items: stretch; gap: 0; flex: 1; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 1rem; font-size: 13px; font-weight: 500;
  color: var(--ink3); cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s; user-select: none;
}
.tab:hover { color: var(--ink2); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.tab-pip {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line2); flex-shrink: 0;
}
.tab.active .tab-pip { background: var(--blue); }
.tab-admin { margin-left: auto; font-size: 12px; gap: 5px; }

/* ─── PIN ─────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(15,15,14,.55); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
}
.pin-card {
  background: var(--card); border-radius: var(--r16);
  padding: 2rem; width: 300px; text-align: center;
  box-shadow: 0 32px 80px rgba(0,0,0,.22), 0 0 0 1px var(--line);
}
.pin-card h3 { font-family: 'Instrument Serif', serif; font-size: 20px; margin-bottom: 4px; }
.pin-card p { font-size: 12px; color: var(--ink3); margin-bottom: 1.5rem; }
.pin-dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 1.5rem; }
.pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line2); transition: all .15s; }
.pin-dot.filled { background: var(--blue); border-color: var(--blue); transform: scale(1.1); }
.pin-pad { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.pin-btn {
  padding: 13px; border: 1px solid var(--line); border-radius: var(--r8);
  background: var(--card); font-family: 'Outfit', sans-serif;
  font-size: 17px; font-weight: 500; cursor: pointer;
  transition: background .1s, transform .08s; color: var(--ink);
}
.pin-btn:hover { background: var(--paper); }
.pin-btn:active { transform: scale(.95); }
.pin-btn.sm { font-size: 13px; color: var(--ink3); }
.pin-err { font-size: 11px; color: var(--red); margin-top: 8px; min-height: 14px; }

/* ─── LAYOUT ──────────────────────────────────────────── */
.page { display: none; padding: 1.75rem 1.5rem 3rem; max-width: 960px; margin: 0 auto; }
.page.active { display: block; animation: fadein .2s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ─── ADMIN ───────────────────────────────────────────── */
.admin-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
.admin-topbar h2 { font-family: 'Instrument Serif', serif; font-size: 24px; }
.btn-ghost {
  font-size: 12px; color: var(--ink3); cursor: pointer;
  padding: 6px 12px; border: 1px solid var(--line2);
  border-radius: var(--r99); font-family: 'Outfit', sans-serif;
  transition: color .15s;
}
.btn-ghost:hover { color: var(--ink2); }
.asec { margin-bottom: 2rem; }
.asec-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink3);
  margin-bottom: .875rem; padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.atable { width: 100%; border-collapse: collapse; border-radius: var(--r12); overflow: hidden; border: 1px solid var(--line); }
.atable th {
  background: var(--paper); padding: 10px 14px; font-size: 11px;
  font-weight: 600; color: var(--ink3); text-align: center;
  border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
}
.atable th:first-child { text-align: left; width: 200px; }
.atable th:last-child { border-right: none; }
.atable td {
  padding: 0; border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line); background: var(--card);
}
.atable td:last-child { border-right: none; }
.atable tr:last-child td { border-bottom: none; }
.atable td.lbl { padding: 10px 14px; font-size: 12px; color: var(--ink2); background: var(--paper); }
.ainput-wrap { display: flex; align-items: center; gap: 4px; padding: 8px 10px; }
.ainput-wrap input {
  flex: 1; min-width: 0; text-align: right; font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600; background: transparent;
  border: none; border-bottom: 1.5px solid var(--line);
  color: var(--ink); outline: none; padding: 2px 0;
}
.ainput-wrap input:focus { border-bottom-color: var(--blue); }
.ainput-wrap .u { font-size: 10px; color: var(--ink3); white-space: nowrap; }
.btn-save {
  padding: 10px 24px; background: var(--blue); color: #fff;
  border: none; border-radius: var(--r8); font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.btn-save:hover { background: #1444b8; }
.save-msg { font-size: 12px; color: var(--green); margin-left: 12px; opacity: 0; transition: opacity .3s; }

/* ─── DEVICE HEADER ───────────────────────────────────── */
.dv-head { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
.dv-head h2 { font-family: 'Instrument Serif', serif; font-size: 26px; letter-spacing: -.02em; }
.dv-head p { font-size: 13px; color: var(--ink3); }

/* ─── DUR SWITCH ──────────────────────────────────────── */
.dur-sw { display: inline-flex; background: var(--line); border-radius: var(--r99); padding: 3px; gap: 2px; margin-bottom: 1.5rem; }
.dur-sw button {
  padding: 5px 18px; border-radius: var(--r99); border: none;
  font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--ink3); background: transparent; cursor: pointer;
  transition: all .15s;
}
.dur-sw button.on { background: var(--card); color: var(--blue); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

/* ─── PARAMS CARD ─────────────────────────────────────── */
.pcard {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r16); padding: 1.25rem 1.5rem 1.5rem;
  margin-bottom: 1.75rem;
}
.pcard-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink3); margin-bottom: 1rem;
}
.pgrid { display: grid; gap: 10px; margin-bottom: 10px; }
.pgrid-2 { grid-template-columns: 1fr 1fr; }
.pgrid-4 { grid-template-columns: repeat(4,1fr); }
.pgrid-3 { grid-template-columns: repeat(3,1fr); }
.pfield {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r8); padding: 10px 12px;
  display: flex; flex-direction: column; gap: 5px;
}
.pfield label { font-size: 10px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
.pfield-row { display: flex; align-items: baseline; gap: 5px; }
.pfield-row input {
  flex: 1; min-width: 0; font-family: 'Outfit', sans-serif;
  font-size: 16px; font-weight: 700; background: transparent;
  border: none; border-bottom: 1.5px solid var(--line2);
  color: var(--ink); outline: none; padding: 1px 0 2px;
}
.pfield-row input:focus { border-bottom-color: var(--blue); }
.pfield-row .u { font-size: 11px; color: var(--ink3); white-space: nowrap; }
.pfield .hint { font-size: 10px; color: var(--ink3); }

/* toggles */
.toggles { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.tog {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: var(--r99);
  border: 1.5px solid var(--line2); background: var(--card);
  font-size: 12px; font-weight: 500; color: var(--ink3);
  cursor: pointer; user-select: none; transition: all .15s;
}
.tog .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line2); flex-shrink: 0; transition: all .15s; }
.tog.on { background: var(--blue-soft); border-color: var(--blue-mid); color: var(--blue); }
.tog.on .dot { background: var(--blue); }
.conv-in {
  width: 60px; font-size: 12px; font-weight: 700;
  border: none; border-bottom: 1px solid currentColor;
  background: transparent; outline: none; color: inherit;
  padding: 0 0 1px; font-family: 'Outfit', sans-serif;
}
.tsep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; flex-shrink: 0; }

/* accord */
.accord {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: var(--r8);
  border: 1.5px solid; margin-top: 1rem;
}
.accord.ok { background: var(--green-soft); border-color: var(--green-mid); }
.accord.warn { background: var(--amber-soft); border-color: var(--amber-mid); }
.accord.ko { background: var(--red-soft); border-color: var(--red-mid); }
.accord-icon { font-size: 16px; flex-shrink: 0; }
.accord-body { flex: 1; }
.accord-title { font-size: 13px; font-weight: 700; }
.accord.ok .accord-title { color: var(--green); }
.accord.warn .accord-title { color: var(--amber); }
.accord.ko .accord-title { color: var(--red); }
.accord-tags { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
.atag {
  font-size: 10px; font-weight: 600; padding: 2px 8px;
  border-radius: var(--r99); border: 1px solid;
}
.accord.ok .atag { color: var(--green); background: var(--green-soft); border-color: var(--green-mid); }
.accord.warn .atag { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-mid); }
.accord.ko .atag { color: var(--red); background: var(--red-soft); border-color: var(--red-mid); }

/* ─── SECTION LABELS ──────────────────────────────────── */
.sec {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink3);
  margin: 1.75rem 0 .875rem; padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

/* ─── CARDS ───────────────────────────────────────────── */
.g2 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.g3 { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
.card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: var(--r16); padding: 18px;
  transition: box-shadow .2s;
}
.card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
.card.star { border-color: var(--blue); border-width: 2px; }
.badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: .04em; padding: 3px 10px;
  background: var(--blue); color: #fff;
  border-radius: var(--r99); margin-bottom: 9px;
}
.ctitle { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.csub { font-size: 11px; color: var(--ink3); margin-bottom: 10px; line-height: 1.4; }
.cprice {
  font-family: 'Instrument Serif', serif;
  font-size: 26px; color: var(--ink); line-height: 1;
  letter-spacing: -.02em;
}
.cprice small { font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 400; color: var(--ink3); }
.crows { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.cr { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--ink3); padding: 3px 0; }
.cr b { color: var(--ink2); font-weight: 600; font-size: 12px; }
.cr.sep { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
.cr.total { color: var(--ink); font-weight: 600; font-size: 12px; }
.cr.total b { font-size: 13px; font-weight: 700; }

/* ─── LEASING ─────────────────────────────────────────── */
.leas-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.leas-hint {
  font-size: 11px; color: var(--ink3); background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--r8);
  padding: 8px 12px; margin-bottom: 12px; line-height: 1.5;
}

/* ─── RENTABILITÉ ─────────────────────────────────────── */
.rentab-tog {
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; font-size: 12px; color: var(--ink3);
  margin-top: 1.75rem; user-select: none; padding: 4px 0;
}
.rentab-tog svg { transition: transform .2s; }
.rentab-tog.open svg { transform: rotate(90deg); }
.rentab-grid { display: none; margin-top: 10px; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; }
.rentab-grid.show { display: grid; }
.rc {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r12); padding: 12px 14px;
}
.rl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); margin-bottom: 5px; }
.rv { font-family: 'Instrument Serif', serif; font-size: 18px; color: var(--ink); }
.rv-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Outfit', sans-serif; font-size: 12px;
  font-weight: 600; padding: 3px 9px; border-radius: var(--r99);
  border: 1px solid;
}
.rv-badge.ok { color: var(--green); background: var(--green-soft); border-color: var(--green-mid); }
.rv-badge.ko { color: var(--red); background: var(--red-soft); border-color: var(--red-mid); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">Tessan<span>.</span></div>
  <div class="tabs">
    <div class="tab active" onclick="goTab('checkup',this)"><div class="tab-pip"></div>Borne Check-up</div>
    <div class="tab" onclick="goTab('tc',this)"><div class="tab-pip"></div>Borne TC</div>
    <div class="tab" onclick="goTab('slim',this)"><div class="tab-pip"></div>Cabine Slim / Uno</div>
    <div class="tab" onclick="goTab('premium',this)"><div class="tab-pip"></div>Cabine Premium</div>
    <div class="tab tab-admin" onclick="openAdmin()">🔒 Admin</div>
  </div>
</nav>

<!-- PIN -->
<div class="overlay" id="pin-ov" style="display:none">
  <div class="pin-card">
    <h3>Espace Admin</h3>
    <p>Entrez votre code PIN</p>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pk(1)">1</button>
      <button class="pin-btn" onclick="pk(2)">2</button>
      <button class="pin-btn" onclick="pk(3)">3</button>
      <button class="pin-btn" onclick="pk(4)">4</button>
      <button class="pin-btn" onclick="pk(5)">5</button>
      <button class="pin-btn" onclick="pk(6)">6</button>
      <button class="pin-btn" onclick="pk(7)">7</button>
      <button class="pin-btn" onclick="pk(8)">8</button>
      <button class="pin-btn" onclick="pk(9)">9</button>
      <button class="pin-btn sm" onclick="pclr()">⌫</button>
      <button class="pin-btn" onclick="pk(0)">0</button>
      <button class="pin-btn sm" onclick="pcan()">✕</button>
    </div>
    <div class="pin-err" id="pin-err"></div>
  </div>
</div>

<!-- PAGES -->
<div class="page active" id="page-checkup"></div>
<div class="page" id="page-tc"></div>
<div class="page" id="page-slim"></div>
<div class="page" id="page-premium"></div>
<div class="page" id="page-admin">
  <div class="admin-topbar">
    <h2>Configuration financière</h2>
    <button class="btn-ghost" onclick="adminLogout()">🔒 Verrouiller</button>
  </div>
  <div id="admin-body"></div>
  <button class="btn-save" onclick="saveAdmin()">Enregistrer</button>
  <span class="save-msg" id="save-msg">✓ Modifications enregistrées</span>
</div>

<script>
// ═══ CONFIG ═══════════════════════════════════════════════
const PIN = '1234'; // ← changer ici
let adminOpen = false;
let pinBuf = '';

const DEVS = ['checkup','tc','slim','premium'];
const DNAMES = ['Borne Check-up','Borne TC','Cabine Slim / Uno','Cabine Premium'];

let CFG = {
  checkup: {
    hasTC:false, hasTED:false, hasPrio:false,
    abo:59.99, achat60:1870, achat48:1870, cac60:2500, cac48:1866,
    leasRate:0.2, cashRate:0.6,
    mat60_1:34.99, mat60_13:34.99, mnt60_1:14.99, mnt60_13:14.99,
    mat48_1:59.99, mat48_13:59.99, mnt48_1:14.99, mnt48_13:14.99,
    tcDef:0, tedDef:0, prioDef:0,
    sR60:3.15, sR48:3.15, sC60:0.20, sC48:0.20
  },
  tc: {
    hasTC:true, hasTED:true, hasPrio:true,
    abo:79.99, achat60:3910, achat48:3910, cac60:2300, cac48:2300,
    leasRate:0.2, cashRate:0.6,
    mat60_1:0, mat60_13:49.99, mnt60_1:0, mnt60_13:29.99,
    mat48_1:0, mat48_13:99.99, mnt48_1:0, mnt48_13:29.99,
    tcDef:30, tedDef:49.99, prioDef:49.99,
    sR60:3.15, sR48:3.15, sC60:0.20, sC48:0.20
  },
  slim: {
    hasTC:true, hasTED:true, hasPrio:true,
    abo:79.99, achat60:8200, achat48:7800, cac60:2300, cac48:2300,
    leasRate:0.2, cashRate:0.6,
    mat60_1:0, mat60_13:119.99, mnt60_1:59.99, mnt60_13:59.99,
    mat48_1:59.99, mat48_13:179.99, mnt48_1:39.99, mnt48_13:59.99,
    tcDef:30, tedDef:49.99, prioDef:49.99,
    sR60:3.15, sR48:3.15, sC60:0.20, sC48:0.20
  },
  premium: {
    hasTC:true, hasTED:true, hasPrio:true,
    abo:79.99, achat60:19470, achat48:19470, cac60:2300, cac48:2300,
    leasRate:0.2, cashRate:0.6,
    mat60_1:199.99, mat60_13:299.99, mnt60_1:99.99, mnt60_13:99.99,
    mat48_1:299.99, mat48_13:449.99, mnt48_1:99.99, mnt48_13:99.99,
    tcDef:50, tedDef:49.99, prioDef:49.99,
    sR60:3.15, sR48:3.15, sC60:0.20, sC48:0.20
  }
};

let ST = {};
DEVS.forEach(id => { ST[id] = { dur:60, ted:false, prio:false, conv:false }; });

// ═══ UTILS ═══════════════════════════════════════════════
function n(v){ return isNaN(v)||!isFinite(v)?0:+v; }
function gv(id){ const e=document.getElementById(id); return e?n(parseFloat(e.value)):0; }
function f(v){ return n(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function fm(v){ return f(v)+'/mois'; }
function fp(v){ return (n(v)*100).toFixed(1)+'%'; }
function el(id){ return document.getElementById(id); }

// ═══ NAVIGATION ══════════════════════════════════════════
function goTab(name, tabEl) {
  if (name==='admin' && !adminOpen) { openAdmin(); return; }
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(tabEl) tabEl.classList.add('active');
  el('page-'+name).classList.add('active');
  if(name==='admin') renderAdmin();
  else renderDevice(name);
}

// ═══ PIN ══════════════════════════════════════════════════
function openAdmin(){
  if(adminOpen){ goTab('admin', document.querySelector('.tab-admin')); return; }
  pinBuf=''; el('pin-ov').style.display='flex'; updDots(); el('pin-err').textContent='';
}
function updDots(){ for(let i=0;i<4;i++) el('pd'+i).classList.toggle('filled',i<pinBuf.length); }
function pk(d){
  if(pinBuf.length>=4) return;
  pinBuf+=d; updDots();
  if(pinBuf.length===4) setTimeout(()=>{
    if(pinBuf===PIN){ adminOpen=true; el('pin-ov').style.display='none'; goTab('admin',document.querySelector('.tab-admin')); }
    else{ el('pin-err').textContent='Code incorrect — réessayez'; pinBuf=''; updDots(); }
  },120);
}
function pclr(){ pinBuf=pinBuf.slice(0,-1); updDots(); el('pin-err').textContent=''; }
function pcan(){ pinBuf=''; el('pin-ov').style.display='none'; }

function arow(label, key, unit, step='1'){

function atable(rows){
  let h = `<table class="atable"><thead><tr><th></th>${DNAMES.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>`;

}

// ═══ COMPUTE ══════════════════════════════════════════════
function compute(id){
  const c=CFG[id], s=ST[id], d=s.dur, rest=d===60?48:36;
  const abo   = gv(id+'_abo');
  const mat   = gv(id+'_mat');
  const maint = gv(id+'_maint');
  const tc    = c.hasTC?gv(id+'_tc'):0;
  const ted   = (c.hasTED&&s.ted)?gv(id+'_ted'):0;
  const prio  = (c.hasPrio&&s.prio)?gv(id+'_prio'):0;
  const conv  = s.conv?gv(id+'_conv'):0;
  const opts  = ted+prio;
  const achat = d===60?c.achat60:c.achat48;
  const cac   = d===60?c.cac60:c.cac48;
  const LR=c.leasRate, CR=c.cashRate;
  const lm1=gv(id+'_lm1'), ln1=gv(id+'_ln1');
  const lm13=d===60?c.mat60_13:c.mat48_13, ln13=d===60?c.mnt60_13:c.mnt48_13;
  const lmt=lm1*12+lm13*rest, lnt=ln1*12+ln13*rest;
  const lfin=lmt+lnt, lfrais=lfin*LR, lcout=lfin+lfrais;
  const abo_tot=abo*d, opts_tot=opts*d;
  const l_tot=abo_tot+lcout+opts_tot+conv, lcash=lcout*CR;
  const l_deb=abo+opts, l_ful=abo+lm13+ln13+opts;
  const cpt_mm=(mat+maint)*0.9;
  const cpt_base=abo_tot+cpt_mm+conv, cpt_tot=cpt_base+opts_tot;
  const x3=cpt_base/3, x4=cpt_base/4;
  const mix_b=mat+maint+conv, mix3=mix_b/3, mix4=mix_b/4;
  const ltv=c.hasTC?tc*7*d:0, ca=l_tot+ltv;
  const costs=achat+cac+conv+lfin*LR;
  const ebitda=(abo_tot+lmt+lnt+ltv)-costs;
  const rentab=costs>0?ca/costs:0;
  const mcash=achat>0?(lcash-achat)/achat:0;
  const sR=d===60?c.sR60:c.sR48, sC=d===60?c.sC60:c.sC48;
  return {abo,mat,maint,tc,ted,prio,conv,opts,d,rest,achat,cac,LR,CR,
    lmt,lnt,lfin,lfrais,lcout,l_deb,l_ful,abo_tot,opts_tot,l_tot,lcash,
    lm1,ln1,lm13,ln13,cpt_mm,cpt_base,cpt_tot,x3,x4,mix_b,mix3,mix4,
    ltv,ca,costs,ebitda,rentab,mcash,sR,sC,
    okA:rentab>=sR, okL:mcash>=sC};
}
