<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessan — Simulateur Commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fff;--sf:#F8F8F8;--sf2:#F0F0F0;
  --bd:#E4E4E4;--bd2:#C8C8C8;
  --ink:#111;--ink2:#444;--ink3:#999;
  --blue:#2563EB;--blue-lt:#EEF4FF;--blue-bd:#BFDBFE;
  --green:#15803D;--green-lt:#F0FDF4;--green-bd:#86EFAC;
  --amber:#B45309;--amber-lt:#FFFBEB;--amber-bd:#FCD34D;
  --red:#B91C1C;--red-lt:#FEF2F2;--red-bd:#FCA5A5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:stretch;padding:0 2rem;height:54px}
.brand{display:flex;align-items:center;padding-right:1.5rem;margin-right:.5rem;border-right:1px solid var(--bd);flex-shrink:0}
.brand img{height:26px;width:auto}
.brand-fb{font-size:17px;font-weight:800;color:var(--blue);letter-spacing:-.03em;display:none}
.tabs{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 1.1rem;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s;user-select:none;flex-shrink:0}
.tab:hover{color:var(--ink2)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--bd2);flex-shrink:0;transition:background .15s}
.tab.active .tdot{background:var(--blue)}
.tab-admin{margin-left:auto}
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.pinbox{background:#fff;border-radius:20px;padding:2rem;width:300px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.2),0 0 0 1px var(--bd)}
.pinbox h3{font-size:18px;font-weight:800;margin-bottom:4px}
.pinbox p{font-size:12px;color:var(--ink3);margin-bottom:1.5rem}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:1.5rem}
.pdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd2);transition:all .15s}
.pdot.on{background:var(--blue);border-color:var(--blue)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pb{padding:14px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:600;cursor:pointer;color:var(--ink);transition:background .1s}
.pb:hover{background:var(--sf)}
.pb.sm{font-size:13px;color:var(--ink3);font-weight:500}
.pin-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px}
.page{display:none;padding:2rem 2.5rem 4rem;max-width:1120px;margin:0 auto}
.page.active{display:block;animation:fi .18s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.admin-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.admin-bar h2{font-size:22px;font-weight:800}
.btn-sm{padding:7px 14px;border:1px solid var(--bd2);border-radius:99px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:500;color:var(--ink3);cursor:pointer;background:#fff}
.btn-sm:hover{color:var(--ink)}
.asec{margin-bottom:2rem}
.asec-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:.75rem;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.atable{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.atable th{background:var(--sf);padding:9px 14px;font-size:11px;font-weight:600;color:var(--ink3);text-align:center;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
.atable th:first-child{text-align:left;min-width:200px}
.atable th:last-child{border-right:none}
.atable td{background:#fff;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:0}
.atable td:last-child{border-right:none}
.atable tr:last-child td{border-bottom:none}
.atable td.lbl{padding:10px 14px;font-size:12px;color:var(--ink2);background:var(--sf)}
.aiw{display:flex;align-items:center;gap:4px;padding:7px 10px}
.aiw input{flex:1;min-width:0;text-align:right;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;background:transparent;border:none;border-bottom:1.5px solid var(--bd);color:var(--ink);outline:none;padding:2px 0}
.aiw input:focus{border-bottom-color:var(--blue)}
.aiw .u{font-size:10px;color:var(--ink3);white-space:nowrap}
.btn-save{padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.btn-save:hover{background:#1d4ed8}
.save-msg{font-size:12px;color:var(--green);margin-left:12px;opacity:0;transition:opacity .3s}
.dv-head{display:flex;align-items:center;gap:16px;margin-bottom:1.5rem}
.dv-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.dv-head p{font-size:13px;color:var(--ink3)}
.dur-sw{display:inline-flex;background:var(--sf2);border-radius:99px;padding:3px;gap:2px;margin-bottom:1.5rem}
.dur-sw button{padding:5px 20px;border-radius:99px;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;color:var(--ink3);background:transparent;cursor:pointer;transition:all .15s}
.dur-sw button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pcard{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:1.5rem;margin-bottom:2rem}
.pcard-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:1.25rem}
.pg{display:grid;gap:10px;margin-bottom:12px}
.pg2{grid-template-columns:1fr 1fr}
.pg4{grid-template-columns:repeat(4,1fr)}
.pf{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pf label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.pf-row{display:flex;align-items:baseline;gap:5px}
.pf-row input{flex:1;min-width:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;background:transparent;border:none;border-bottom:1.5px solid var(--bd2);color:var(--ink);outline:none;padding:1px 0 3px;width:100%}
.pf-row input:focus{border-bottom-color:var(--blue)}
.pf-row .u{font-size:12px;color:var(--ink3);flex-shrink:0}
.pf .hint{font-size:10px;color:var(--ink3)}
.toggles{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tog{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--bd2);background:#fff;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;user-select:none;transition:all .15s}
.tog .dot{width:7px;height:7px;border-radius:50%;background:var(--bd2);flex-shrink:0;transition:all .15s}
.tog.on{background:var(--blue-lt);border-color:var(--blue-bd);color:var(--blue)}
.tog.on .dot{background:var(--blue)}
.conv-in{width:64px;font-size:12px;font-weight:700;border:none;border-bottom:1.5px solid currentColor;background:transparent;outline:none;color:inherit;padding:0 0 1px;font-family:'Plus Jakarta Sans',sans-serif}
.accord-block{margin-top:1.25rem;display:flex;flex-direction:column;gap:8px}
.accord{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;border:1.5px solid}
.accord.ok{background:var(--green-lt);border-color:var(--green-bd)}
.accord.warn{background:var(--amber-lt);border-color:var(--amber-bd)}
.accord.ko{background:var(--red-lt);border-color:var(--red-bd)}
.accord-ico{font-size:16px;flex-shrink:0}
.accord-lbl{font-size:11px;font-weight:500;flex:1}
.accord.ok .accord-lbl{color:var(--green)}
.accord.warn .accord-lbl{color:var(--amber)}
.accord.ko .accord-lbl{color:var(--red)}
.accord-val{font-size:11px;font-weight:700;white-space:nowrap}
.accord.ok .accord-val{color:var(--green)}
.accord.warn .accord-val{color:var(--amber)}
.accord.ko .accord-val{color:var(--red)}
.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:2rem 0 1rem;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1.5px solid var(--bd);border-radius:16px;padding:20px}
.card.star{border-color:var(--blue);border-width:2px}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 10px;background:var(--blue);color:#fff;border-radius:99px;margin-bottom:10px}
.ctitle{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px}
.csub{font-size:11.5px;color:var(--ink3);margin-bottom:12px;line-height:1.5}
.cprice{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1}
.cprice small{font-size:12px;font-weight:400;color:var(--ink3)}
.crows{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.cr{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3);padding:3px 0}
.cr b{color:var(--ink2);font-weight:600}
.cr.sep{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.cr.tot{color:var(--ink);font-weight:700}
.cr.tot b{font-size:13px;font-weight:800;color:var(--ink)}
.leas-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.leas-note{font-size:11.5px;color:var(--ink3);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.6}
.rtog{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--ink3);margin-top:2rem;user-select:none;padding:4px 0;font-weight:500}
.rtog svg{transition:transform .2s}
.rtog.open svg{transform:rotate(90deg)}
.rgrid{display:none;margin-top:12px;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rgrid.show{display:grid}
.rc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}
.rl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:6px}
.rv{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.rv small{font-size:11px;font-weight:400;color:var(--ink3);display:block;margin-top:2px}
.rbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid}
.rbadge.ok{color:var(--green);background:var(--green-lt);border-color:var(--green-bd)}
.rbadge.ko{color:var(--red);background:var(--red-lt);border-color:var(--red-bd)}

</style>
</head>
<body>

<nav class="nav">
  <div class="brand">
    <img src="https://www.tessan.io/wp-content/uploads/2022/09/Logo-Tessan.png" alt="Tessan"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="brand-fb">tessan</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="checkup"><div class="tdot"></div>Borne Check-up</div>
    <div class="tab" data-tab="tc"><div class="tdot"></div>Borne TC</div>
    <div class="tab" data-tab="slim"><div class="tdot"></div>Cabine Slim / Uno</div>
    <div class="tab" data-tab="premium"><div class="tdot"></div>Cabine Premium</div>
    <div class="tab tab-admin" data-tab="admin">🔒 Admin</div>
  </div>
</nav>

<div class="overlay" id="pin-ov" style="display:none">
  <div class="pinbox">
    <h3>Espace Admin</h3>
    <p>Entrez votre code PIN</p>
    <div class="pin-dots">
      <div class="pdot" id="pd0"></div><div class="pdot" id="pd1"></div>
      <div class="pdot" id="pd2"></div><div class="pdot" id="pd3"></div>
    </div>
    <div class="pin-pad">
      <button class="pb" data-pk="1">1</button><button class="pb" data-pk="2">2</button><button class="pb" data-pk="3">3</button>
      <button class="pb" data-pk="4">4</button><button class="pb" data-pk="5">5</button><button class="pb" data-pk="6">6</button>
      <button class="pb" data-pk="7">7</button><button class="pb" data-pk="8">8</button><button class="pb" data-pk="9">9</button>
      <button class="pb sm" id="pb-clr">⌫</button><button class="pb" data-pk="0">0</button><button class="pb sm" id="pb-can">✕</button>
    </div>
    <div class="pin-err" id="pin-err"></div>
  </div>
</div>

<div class="page active" id="page-checkup"></div>
<div class="page" id="page-tc"></div>
<div class="page" id="page-slim"></div>
<div class="page" id="page-premium"></div>
<div class="page" id="page-admin">
  <div class="admin-bar">
    <h2>Configuration financière</h2>
    <button class="btn-sm" id="btn-logout">🔒 Verrouiller</button>
  </div>
  <div id="admin-body"></div>
  <div style="margin-top:1.5rem;display:flex;align-items:center">
    <button class="btn-save" id="btn-save">Enregistrer les modifications</button>
    <span class="save-msg" id="save-msg">✓ Sauvegardé</span>
  </div>
</div>

<script>

const PIN = '1234';
let adminOpen = false, pinBuf = '';
const DEVS   = ['checkup','tc','slim','premium'];
const DNAMES = ['Borne Check-up','Borne TC','Cabine Slim/Uno','Cabine Premium'];

// ── CONFIG ────────────────────────────────────────────────────────────────
// Seuils de validation dossier (mat+maint total sur duree >= seuil)
// PDF p.6: Borne TC >= 3839, Slim/Uno >= 8998, Premium >= 22798, Check-up >= 2250
const CFG = {
  checkup:{
    name:'Borne Check-up', hasTC:false, hasTED:false, hasPrio:false,
    abo:59.99, achat60:1870, cac60:2500, achat48:1870, cac48:1866,
    leasRate:0.2, cashRate:0.6,
    mat60_1:34.99, mat60_13:34.99, mnt60_1:14.99, mnt60_13:14.99,
    mat48_1:59.99, mat48_13:59.99, mnt48_1:14.99, mnt48_13:14.99,
    tcDef:0, tedDef:0, prioDef:0,
    seuilDossier:2250, seuilCash:0.20, seuilRentab:3.15
  },
  tc:{
    name:'Borne TC', hasTC:true, hasTED:true, hasPrio:true,
    abo:79.99, achat60:3910, cac60:2300, achat48:3910, cac48:2300,
    leasRate:0.2, cashRate:0.6,
    mat60_1:0, mat60_13:49.99, mnt60_1:0, mnt60_13:29.99,
    mat48_1:0, mat48_13:99.99, mnt48_1:0, mnt48_13:29.99,
    tcDef:30, tedDef:49.99, prioDef:49.99,
    seuilDossier:3839, seuilCash:0.20, seuilRentab:3.15
  },
  slim:{
    name:'Cabine Slim / Uno', hasTC:true, hasTED:true, hasPrio:true,
    abo:79.99, achat60:8200, cac60:2300, achat48:7800, cac48:2300,
    leasRate:0.2, cashRate:0.6,
    mat60_1:0,     mat60_13:119.99, mnt60_1:59.99, mnt60_13:59.99,
    mat48_1:59.99, mat48_13:179.99, mnt48_1:39.99, mnt48_13:59.99,
    tcDef:30, tedDef:49.99, prioDef:49.99,
    seuilDossier:8998, seuilCash:0.20, seuilRentab:3.15
  },
  premium:{
    name:'Cabine Premium', hasTC:true, hasTED:true, hasPrio:true,
    abo:79.99, achat60:19470, cac60:2300, achat48:19470, cac48:2300,
    leasRate:0.2, cashRate:0.6,
    mat60_1:199.99, mat60_13:299.99, mnt60_1:99.99, mnt60_13:99.99,
    mat48_1:299.99, mat48_13:449.99, mnt48_1:99.99, mnt48_13:99.99,
    tcDef:50, tedDef:49.99, prioDef:49.99,
    seuilDossier:22798, seuilCash:0.20, seuilRentab:3.15
  }
};

const ST = {};
DEVS.forEach(id => { ST[id] = { dur:60, ted:false, prio:false, conv:false }; });

// ── UTILS ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function n(v){ return isNaN(v)||!isFinite(v)?0:+v; }
function gv(id){ const e=$(id); return e?n(parseFloat(e.value)):0; }
function ff(v){ return n(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+'\u00a0\u20ac'; }
function fm(v){ return ff(v)+'/mois'; }
function fp(v){ return (n(v)*100).toFixed(1)+'%'; }

// ── NAV ───────────────────────────────────────────────────────────────────
function goTab(name){
  if(name==='admin'&&!adminOpen){ openAdmin(); return; }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+name).classList.add('active');
  if(name==='admin') renderAdmin(); else renderDevice(name);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>goTab(t.dataset.tab)));

// ── PIN ───────────────────────────────────────────────────────────────────
function openAdmin(){
  if(adminOpen){ goTab('admin'); return; }
  pinBuf=''; $('pin-ov').style.display='flex'; updDots(); $('pin-err').textContent='';
}
function updDots(){ for(let i=0;i<4;i++) $('pd'+i).classList.toggle('on',i<pinBuf.length); }
function pk(d){
  if(pinBuf.length>=4) return;
  pinBuf+=String(d); updDots();
  if(pinBuf.length===4) setTimeout(()=>{
    if(pinBuf===PIN){ adminOpen=true; $('pin-ov').style.display='none'; goTab('admin'); }
    else{ $('pin-err').textContent='Code incorrect'; pinBuf=''; updDots(); }
  },120);
}
document.querySelectorAll('.pb[data-pk]').forEach(b=>b.addEventListener('click',()=>pk(b.dataset.pk)));
$('pb-clr').addEventListener('click',()=>{ pinBuf=pinBuf.slice(0,-1); updDots(); $('pin-err').textContent=''; });
$('pb-can').addEventListener('click',()=>{ pinBuf=''; $('pin-ov').style.display='none'; });
$('btn-logout').addEventListener('click',()=>{ adminOpen=false; goTab('checkup'); });
$('btn-save').addEventListener('click',saveAdmin);

// ── ADMIN ─────────────────────────────────────────────────────────────────
function ai(d,k,u,s){ return '<div class="aiw"><input id="a_'+d+'_'+k+'" type="number" value="'+CFG[d][k]+'" step="'+s+'"><span class="u">'+u+'</span></div>'; }
function arow(lbl,k,u,s){ return '<tr><td class="lbl">'+lbl+'</td>'+DEVS.map(d=>'<td>'+ai(d,k,u,s)+'</td>').join('')+'</tr>'; }
function atable(rows){
  return '<table class="atable"><thead><tr><th></th>'+DNAMES.map(n=>'<th>'+n+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>arow(r[0],r[1],r[2],r[3]||'1')).join('')+'</tbody></table>';
}
function renderAdmin(){
  $('admin-body').innerHTML=
    '<div class="asec"><div class="asec-ttl">Prix achat &amp; CAC</div>'+
    atable([['Achat 60 mois','achat60','\u20ac'],['Achat 48 mois','achat48','\u20ac'],
            ['CAC 60 mois','cac60','\u20ac'],['CAC 48 mois','cac48','\u20ac'],
            ['Frais leasing','leasRate','%','0.01'],['Cash imm. (%)','cashRate','%','0.01']])+'</div>'+
    '<div class="asec"><div class="asec-ttl">Mensualit\u00e9s leasing par d\u00e9faut</div>'+
    atable([['Mat. 60m M1-12','mat60_1','\u20ac/mois','0.01'],['Mat. 60m M13+','mat60_13','\u20ac/mois','0.01'],
            ['Maint. 60m M1-12','mnt60_1','\u20ac/mois','0.01'],['Maint. 60m M13+','mnt60_13','\u20ac/mois','0.01'],
            ['Mat. 48m M1-12','mat48_1','\u20ac/mois','0.01'],['Mat. 48m M13+','mat48_13','\u20ac/mois','0.01'],
            ['Maint. 48m M1-12','mnt48_1','\u20ac/mois','0.01'],['Maint. 48m M13+','mnt48_13','\u20ac/mois','0.01']])+'</div>'+
    '<div class="asec"><div class="asec-ttl">TC / mois par d\u00e9faut</div>'+
    atable([['TC par d\u00e9faut','tcDef','cons.']])+'</div>'+
    '<div class="asec"><div class="asec-ttl">Seuils d\'accord (modifiables)</div>'+

// ── COMPUTE (rules from PDF cahier des charges) ───────────────────────────
function compute(id){
  const c=CFG[id], s=ST[id], d=s.dur, rest=d===60?48:36;

  const abo   = gv(id+'_abo');
  const mat   = gv(id+'_mat');
  const maint = gv(id+'_maint');  // mensualite maintenance saisie
  const tc    = c.hasTC ? gv(id+'_tc') : 0;
  const tedP  = c.hasTED  ? gv(id+'_ted')  : 0;
  const prioP = c.hasPrio ? gv(id+'_prio') : 0;
  const ted   = s.ted  ? tedP  : 0;
  const prio  = s.prio ? prioP : 0;
  const conv  = s.conv ? gv(id+'_conv') : 0;

  const achat = d===60?c.achat60:c.achat48;
  const cac   = d===60?c.cac60  :c.cac48;
  const LR=c.leasRate, CR=c.cashRate;

  // ── COMPTANT (PDF p.2) ──────────────────────────────────────────────────
  // "Service Tessan inclus dans le prix total + ZERO mensualite"
  // Paiement = (service x duree) + ((mat + maintenance) x 0.9) + conversion
  // Note: maintenance ici = total maintenance sur duree ? Non.
  // En relisant xlsx: G7 = G24*0.9 (cout total a financer leasing)
  // et F7 = service mensuel (pas service total)
  // MAIS le PDF dit: "Service mensuel x duree" -> service total sur duree
  // On choisit la formule PDF (plus logique pour le client):
  // cpt_service = abo * d  (service total integre)
  // cpt_matmaint = (mat + maint) * 0.9  (mat+maintenance avec remise 10%)
  // Note sur maint: on utilise la valeur mensuelle * duree pour coerente
  // Mais xlsx utilise G24 (cout financement leasing) pour la remise...
  // On suit le PDF qui dit simplement (mat + maintenance) -10%
  const maint_tot = maint * d;  // maintenance totale sur duree
  const cpt_service = abo * d;
  const cpt_matmaint = (mat + maint_tot) * 0.9;  // remise 10% sur mat+maint total
  const cpt_opts_tot = (ted + prio) * d;
  const cpt_total = cpt_service + cpt_matmaint + conv + cpt_opts_tot;
  const cpt_x3 = cpt_total / 3;
  const cpt_x4 = cpt_total / 4;

  // ── MIXTE (PDF p.3) ─────────────────────────────────────────────────────
  // "Service Tessan mensuel + paiement materiel (1x/3x/4x)"
  // "materiel + maintenance + rachat eventuel"
  const mix_base = mat + maint_tot + conv;  // ce qui est fractionne
  const mix3 = mix_base / 3;
  const mix4 = mix_base / 4;
  // mensualite totale mixte = abo + ted + prio (prelevement mensuel)
  const mix_mens = abo + ted + prio;

  // ── LEASING ──────────────────────────────────────────────────────────────
  // Mensualites M1-12 saisies par le sales (champs modulables)
  const lm1  = gv(id+'_lm1');
  const ln1  = gv(id+'_ln1');
  // M13+ depuis config admin
  const lm13 = d===60?c.mat60_13:c.mat48_13;
  const ln13 = d===60?c.mnt60_13:c.mnt48_13;

  // Total mat leasing = (lm1*12)+(lm13*rest)  — xlsx G21=(G19*12)+(G20*48)
  const lmat_tot = (lm1*12) + (lm13*rest);
  // Total maint leasing = (ln1*12)+(ln13*rest)  — xlsx I21=(I19*12)+(I20*48)
  const lmnt_tot = (ln1*12) + (ln13*rest);

  // Financable = lmat_tot + lmnt_tot + conv  (xlsx G22=G21+I21)
  const l_fin = lmat_tot + lmnt_tot + conv;
  // Cout total a financer = financable x 1.20  (xlsx G24=G22*1.2)
  const l_total_fin = l_fin * (1 + LR);
  const l_frais = l_fin * LR;
  // Cash immediat = cout_total x 0.60  (xlsx G37=G24*0.6)
  const l_cash = l_total_fin * CR;

  // Mensualite theorique
  const l_mens_calc = l_total_fin / d;
  // Mensualites affichees
  const l_mens_deb = abo + lm1 + ln1 + ted + prio;
  const l_mens_ful = abo + lm13 + ln13 + ted + prio;
  // Totaux
  const l_service_tot = abo * d;
  const l_client_total = l_service_tot + l_total_fin + (ted+prio)*d;

  // ── RENTABILITE (PDF p.4-5) ──────────────────────────────────────────────
  // CA direct = tout ce que paie le client
  const ca_direct = l_client_total;
  // LTV TC (si applicable)
  // LTV toujours sur 60 mois (formule xlsx G32=F18*7*60 et G70=F56*7*60)
  const ltv = c.hasTC ? tc * 7 * 60 : 0;
  // CA total = CA direct + LTV TC
  const ca_total = ca_direct + ltv;
  // Couts Tessan = achat + CAC + conversion + (mat+maint) * frais leasing
  // Formule: 3910 + 2300 + conv + (lmat_tot + lmnt_tot) * 0.20
  const cout_tessan = achat + cac + conv + ((lmat_tot + lmnt_tot) * LR);
  // EBITDA (xlsx G35 = (F21+G21+I21+G32) - G31)
  // = (service_tot + mat_tot_leasing + maint_tot_leasing + LTV) - cout_tessan
  const ebitda = (l_service_tot + lmat_tot + lmnt_tot + ltv) - cout_tessan;
  // Rentabilite = CA total / cout Tessan
  const rentab = cout_tessan > 0 ? ca_total / cout_tessan : 0;
  // Marge sur cash = (cash - cout materiel) / cout materiel
  const mcash  = achat > 0 ? (l_cash - achat) / achat : 0;

  // ── VALIDATIONS (PDF p.6) ────────────────────────────────────────────────
  // 1. Validation dossier: mat + maint (total sur duree) >= seuil
  const val_dossier = (mat + maint_tot) >= c.seuilDossier;
  // 2. Validation leasing: marge cash > 20%
  const val_leas = mcash > c.seuilCash;
  // 3. Validation comptant: rentabilite >= 315%
  const val_cpt  = rentab >= c.seuilRentab;

  return {
    abo, mat, maint, maint_tot, tc, tedP, prioP, ted, prio, conv, d, rest,
    achat, cac, LR, CR,
    cpt_service, cpt_matmaint, cpt_opts_tot, cpt_total, cpt_x3, cpt_x4,
    mix_base, mix3, mix4, mix_mens,
    lm1, ln1, lm13, ln13, lmat_tot, lmnt_tot,
    l_fin, l_frais, l_total_fin, l_cash, l_mens_calc, l_mens_deb, l_mens_ful,
    l_service_tot, l_client_total,
    ltv, ca_direct, ca_total, cout_tessan, ebitda, rentab, mcash,
    val_dossier, val_leas, val_cpt,
    seuilDossier: c.seuilDossier, seuilCash: c.seuilCash, seuilRentab: c.seuilRentab
  };
}

    '<div class="card"><div class="ctitle">Leasing '+v.d+' mois \u2014 mensualit\u00e9s</div>'+

    '<div class="cprice">'+fm(v.l_mens_ful)+'<small> \u00e0 partir de M13</small></div>'+
    '<div class="crows">'+
      '<div class="cr"><span>Mensualit\u00e9 M1\u201312</span><b>'+fm(v.l_mens_deb)+'</b></div>'+
      '<div class="cr sep"><span>Abonnement Tessan</span><b>'+fm(v.abo)+'</b></div>'+
      '<div class="cr"><span>Mat\u00e9riel M1\u201312</span><b>'+fm(v.lm1)+'</b></div>'+
      '<div class="cr"><span>Mat\u00e9riel M13\u2013'+v.d+'</span><b>'+fm(v.lm13)+'</b></div>'+
      '<div class="cr"><span>Maintenance M1\u201312</span><b>'+fm(v.ln1)+'</b></div>'+
      '<div class="cr"><span>Maintenance M13\u2013'+v.d+'</span><b>'+fm(v.ln13)+'</b></div>'+
      tedL+prioL+
      '<div class="cr sep tot"><span>Co\u00fbt total client '+v.d+' mois</span><b>'+ff(v.l_client_total)+'</b></div>'+
    '</div></div>'+

    '<div class="card"><div class="ctitle">Leasing '+v.d+' mois \u2014 financement</div>'+
    '<div class="csub">Financ\u00e9 = mensualit\u00e9s mat+maint sur '+v.d+' mois + conversion</div>'+
    '<div class="cprice">'+ff(v.l_fin)+'<small> financ\u00e9</small></div>'+
    '<div class="crows">'+
      '<div class="cr"><span>Mat\u00e9riel total en leasing</span><b>'+ff(v.lmat_tot)+'</b></div>'+
      '<div class="cr"><span>Maintenance totale en leasing</span><b>'+ff(v.lmnt_tot)+'</b></div>'+
      (v.conv>0?'<div class="cr"><span>Conversion</span><b>'+ff(v.conv)+'</b></div>':'')+
      '<div class="cr sep"><span>Co\u00fbt leasing (+'+Math.round(v.LR*100)+'%)</span><b>'+ff(v.l_frais)+'</b></div>'+
      '<div class="cr"><span>Montant total \u00e0 financer</span><b>'+ff(v.l_total_fin)+'</b></div>'+
      '<div class="cr"><span>Mensualit\u00e9 th\u00e9orique mat+maint</span><b>'+fm(v.l_mens_calc)+'</b></div>'+
      '<div class="cr sep tot"><span>Cash imm\u00e9diat Tessan ('+Math.round(v.CR*100)+'% du total)</span><b>'+ff(v.l_cash)+'</b></div>'+
    '</div></div>';

  // ── RENTAB ──
  const rb=(ok,val)=>'<span class="rbadge '+(ok?'ok':'ko')+'">'+(ok?'\u2713':'\u2717')+' '+val+'</span>';
  $( id+'_rentab').innerHTML=
    '<div class="rc"><div class="rl">CA direct</div><div class="rv">'+ff(v.ca_direct)+'</div></div>'+
    (c.hasTC?'<div class="rc"><div class="rl">LTV TC</div><div class="rv">'+ff(v.ltv)+'<small>'+v.tc+'\u00d77\u20ac\u00d7'+v.d+'m</small></div></div>':'')+
    '<div class="rc"><div class="rl">CA total</div><div class="rv">'+ff(v.ca_total)+'</div></div>'+
    '<div class="rc"><div class="rl">Co\u00fbts Tessan</div><div class="rv">'+ff(v.cout_tessan)+'</div></div>'+
    '<div class="rc"><div class="rl">EBITDA</div><div class="rv">'+ff(v.ebitda)+'</div></div>'+
    '<div class="rc"><div class="rl">Rentabilit\u00e9 (seuil '+Math.round(v.seuilRentab*100)+'%)</div><div class="rv">'+rb(v.val_cpt,fp(v.rentab))+'</div></div>'+
    '<div class="rc"><div class="rl">Marge cash (seuil '+fp(v.seuilCash)+')</div><div class="rv">'+rb(v.val_leas,fp(v.mcash))+'</div></div>'+
    '<div class="rc"><div class="rl">Cash imm\u00e9diat</div><div class="rv">'+ff(v.l_cash)+'</div></div>';
}

// ── INIT ──────────────────────────────────────────────────────────────────
DEVS.forEach(id=>buildPage(id));
renderDevice('checkup');

</script>
